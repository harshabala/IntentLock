<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntentLock</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="lock-container">
    <div class="header">
      <h1>What are you trying to achieve?</h1>
    </div>

    <form id="intent-form" novalidate>
      <div class="input-group">
        <label for="intent-input">Intent</label>
        <textarea id="intent-input" placeholder="Enter your task (e.g., 'Write Q3 report')" required autofocus maxlength="250"></textarea>
      </div>

      <div class="input-group">
        <label for="time-budget">Minutes (optional)</label>
        <input type="text" id="time-budget" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="30">
      </div>

      <button type="submit" id="start-btn">Lock in</button>
    </form>

    <div id="status-message" class="hidden"></div>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
