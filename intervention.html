<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IntentLock — Drift</title>
  <link rel="stylesheet" href="newtab.css">
  <link rel="stylesheet" href="intervention.css">
</head>
<body class="intervention">
  <main class="lock-container" role="dialog" aria-modal="true" aria-labelledby="intervention-title" aria-describedby="reason-text" tabindex="-1">
    <div class="header">
      <h1 id="intervention-title">You are drifting from your intent.</h1>
      <p id="reason-text"></p>
    </div>

    <p class="intent-quote" id="current-intent">Loading...</p>

    <form id="reflection-form">
      <div class="input-group stagger-1">
        <label for="reflection-input">Why?</label>
        <textarea id="reflection-input" placeholder="Enter why this page, given your intent." autofocus maxlength="2000"></textarea>
      </div>

      <label class="related-toggle" for="intentlock-mark-related">
        <input type="checkbox" id="intentlock-mark-related">
        <span>This site is related to my intent</span>
      </label>

      <p id="transition-error" class="transition-error" role="alert" aria-live="polite"></p>
      <p id="continue-hint" class="field-hint">Write why to continue.</p>
      <p id="lock-explanation" class="field-hint">Continue anyway allows this site for 5 minutes. Tick "related" to allow it for the rest of this session. Your time budget runs separately.</p>

      <div class="intervention-actions">
        <button type="button" id="return-btn" class="primary-btn btn--primary stagger-2">Close this tab</button>
        <button type="submit" id="override-btn" class="override-btn btn--ghost stagger-3" aria-describedby="continue-hint" aria-disabled="true">Continue anyway</button>
        <button type="button" id="end-session-btn" class="end-session-btn">End session</button>
      </div>
    </form>
  </main>

  <script src="intervention.js"></script>
</body>
</html>
