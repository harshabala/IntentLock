<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IntentLock — Drift</title>
  <link rel="stylesheet" href="newtab.css">
  <link rel="stylesheet" href="intervention.css">
</head>
<body class="intervention">
  <main class="lock-container" role="dialog" aria-modal="true" aria-labelledby="intervention-title" aria-describedby="reason-text" tabindex="-1">
    <div class="header">
      <h1 id="intervention-title">Drift detected</h1>
      <p id="reason-text">You are deviating from your intent.</p>
    </div>

    <div class="intervention-intent">
      <p class="intervention-intent-label">Session intent</p>
      <p class="intervention-intent-text" id="current-intent">Loading...</p>
    </div>

    <form id="reflection-form">
      <div class="input-group stagger-1">
        <label for="reflection-input">Why are you deviating?</label>
        <textarea id="reflection-input" placeholder="I need a break, or this is actually relevant..." required autofocus></textarea>
      </div>

      <label class="related-toggle" for="intentlock-mark-related">
        <input type="checkbox" id="intentlock-mark-related">
        <span>This site is related to my intent</span>
      </label>

      <p id="transition-error" class="transition-error" role="alert" aria-live="polite"></p>

      <div class="intervention-actions">
        <button type="button" id="return-btn" class="primary-btn stagger-2">Close tab</button>
        <button type="submit" id="override-btn" class="override-btn stagger-3">Override &amp; continue</button>
        <button type="button" id="end-session-btn" class="end-session-btn">End session</button>
      </div>
    </form>
  </main>

  <script src="intervention.js"></script>
</body>
</html>
